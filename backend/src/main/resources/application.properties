spring.application.name=psychology-api

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

server.port=${PORT:8080}
server.jwt.secret=${JWT_SECRET}
app.cors.origins=${APP_CORS_ORIGINS:http://localhost:5173}
app.refresh.expiracao-dias=${APP_REFRESH_EXPIRACAO_DIAS:14}
app.refresh.cookie-seguro=${APP_REFRESH_COOKIE_SEGURO:true}
app.refresh.cookie-samesite=${APP_REFRESH_COOKIE_SAMESITE:None}

# contrato OpenAPI: ligado em desenvolvimento, DESLIGADO em producao.
# O deploy da Fatia 5 tem que setar SPRINGDOC_ENABLED=false
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:true}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:true}
