spring.application.name=psychology-api

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

server.port=${PORT:8080}
server.jwt.secret=${JWT_SECRET}
app.cors.origins=${APP_CORS_ORIGINS:http://localhost:5173}
app.refresh.expiracao-dias=${APP_REFRESH_EXPIRACAO_DIAS:14}
app.refresh.cookie-seguro=${APP_REFRESH_COOKIE_SEGURO:true}
app.refresh.cookie-samesite=${APP_REFRESH_COOKIE_SAMESITE:None}

# contrato OpenAPI: ligado em desenvolvimento, DESLIGADO em producao.
# O deploy da Fatia 5 tem que setar SPRINGDOC_ENABLED=false
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:true}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:true}

app.email.remetente=${APP_EMAIL_REMETENTE:lembretes@localhost}
app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}
app.avisos.habilitado=${APP_AVISOS_HABILITADO:true}
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
